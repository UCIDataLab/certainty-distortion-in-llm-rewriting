connection_configs:
    api_key: ""
    base_url: http://localhost:8892/v1
    
model_configs:
  model_name: Qwen/Qwen3-8B
  model_device: vllm
  gen_kwargs:
    temperature: 1.0
    top_p: 0.9
    max_tokens: 3500


experiment_configs:
  _class_: experiment_base.MultiNoHistoryExperiment
  system_prompt: "Your task is to paraphrase an English text. The paraphrase should be no longer than {n_sentences} sentences. Return **only** the paraphrased text. Do not include a header, preamble, or any text outside the paraphrased text. The final answer should be enclosed in <final_answer></final_answer> tags."
  n_turns: 1
  n_samples: 1
  output_path: output/uncertainty-in-llms-results/top-p-sampling/multi-sentence-level/medical-paraphrase/qwen3-8b.jsonl


data_configs:
  input_path: data/preprocessed/MIMIC-CXR_uncertain_only__800.csv
  jinja_template: |
    FINDINGS: 
    
    {{ FINDINGS }}


