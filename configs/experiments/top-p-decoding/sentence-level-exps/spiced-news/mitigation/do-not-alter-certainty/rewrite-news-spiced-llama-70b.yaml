connection_configs:
    api_key: ""
    base_url: http://localhost:8893/v1
    
model_configs:
  model_name: meta-llama/Llama-3.3-70B-Instruct
  model_device: vllm
  gen_kwargs:
    temperature: 1.0
    top_p: 0.9
    max_tokens: 1000

experiment_configs:
  _class_: experiment_base.MultiNoHistoryExperiment
  system_prompt: "Imagine you are a New York Times journalist. Rewrite the following scientific finding as **one sentence** suitable for publication. Preserve semantics of the original text. Do not hallucinate. Preserve the degree of certainty in the original text. Return **only** the sentence."
  n_turns: 1
  n_samples: 1
  output_path: output/uncertainty-in-llms-results/mitigation/sentence-level/do-not-alter-certainty/rewrite-spiced-news/llama-v3p3-70b-instruct.jsonl

data_configs:
  input_path: data/preprocessed/SPICED-news.csv
  jinja_template: |
    {{ Paper_Finding }}

