connection_configs:
    api_key: 

model_configs:
  model_name: gpt-5.4-mini
  model_device: openai
  gen_kwargs:
    temperature: 1.0
    top_p: 0.9
    max_completion_tokens: 1000

experiment_configs:
  _class_: experiment_base.MultiNoHistoryExperiment
  system_prompt: "Paraphrase this radiology findings sentence. Your paraphrase must be 1 sentence long. Return **only** the paraphrased text."
  n_turns: 1
  n_samples: 1
  output_path: output/uncertainty-in-llms-results/top-p-sampling/sentence-level/paraphrase-medical-finding/gpt-5-mini.jsonl
  
data_configs:
  input_path: sv
  jinja_template: |
    {{ sentence }}


