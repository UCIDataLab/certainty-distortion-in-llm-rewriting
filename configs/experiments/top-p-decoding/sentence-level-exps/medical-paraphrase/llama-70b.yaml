experiment_configs:
  _class_: experiment_base.MultiNoHistoryExperiment
  system_prompt: "Paraphrase this radiology findings sentence. Your paraphrase must be 1 sentence long. Return **only** the paraphrased text."
  n_turns: 5
  n_samples: 1
  output_path: output/uncertainty-in-llms-results/top-p-sampling/sentence-level/paraphrase-medical-finding/llama-v3p3-70b-instruct.jsonl
  
data_configs:
  input_path: data/preprocessed/MIMIC-CXR_combined_800.csv
  jinja_template: |
    {{ sentence }}


