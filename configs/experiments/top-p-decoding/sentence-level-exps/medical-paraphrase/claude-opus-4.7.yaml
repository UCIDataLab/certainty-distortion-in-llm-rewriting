connection_configs:
    api_key: configs/api_keys/anthropic.txt
    base_url: https://api.anthropic.com/v1/

model_configs:
  model_name: claude-opus-4-7
  model_device: openai
  gen_kwargs:
    max_tokens: 1000

experiment_configs:
  _class_: experiment_base.MultiNoHistoryExperiment
  system_prompt: "Paraphrase this radiology findings sentence. Your paraphrase must be 1 sentence long. Return **only** the paraphrased text."
  n_turns: 1
  n_samples: 1
  output_path: output/uncertainty-in-llms-results/top-p-sampling/sentence-level/paraphrase-medical-finding/claude-opus-4-7.jsonl
  
data_configs:
  input_path: data/preprocessed/MIMIC-CXR_combined_800.csv
  jinja_template: |
    {{ sentence }}


