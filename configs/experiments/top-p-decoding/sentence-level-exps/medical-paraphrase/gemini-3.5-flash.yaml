connection_configs:
    api_key: configs/api_keys/gemini.txt
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/

model_configs:
  model_name: gemini-3.5-flash
  model_device: openai
  gen_kwargs:
    temperature: 1.0
    top_p: 0.9
    max_tokens: 1000
    # the default reasoning effort for gemini-3.1-flash-lite is  "minimal"
    # source: https://ai.google.dev/gemini-api/docs/thinking#levels
    # reasoning_effort: minimal

experiment_configs:
  _class_: experiment_base.MultiNoHistoryExperiment
  system_prompt: "Paraphrase this radiology findings sentence. Your paraphrase must be 1 sentence long. Return **only** the paraphrased text."
  n_turns: 1
  n_samples: 1
  output_path: output/uncertainty-in-llms-results/top-p-sampling/sentence-level/paraphrase-medical-finding/gemini-3.5-flash.jsonl
  
data_configs:
  input_path: data/preprocessed/MIMIC-CXR_combined_800.csv
  jinja_template: |
    {{ sentence }}


# gemini-3.5-flash
