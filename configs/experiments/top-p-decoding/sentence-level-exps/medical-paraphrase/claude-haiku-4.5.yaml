connection_configs:
    api_key: configs/api_keys/anthropic.txt
    base_url: https://api.anthropic.com/v1/

model_configs:
  model_name: claude-haiku-4-5-20251001
  model_device: openai
  gen_kwargs:
    top_p: 0.9
    max_tokens: 1000

experiment_configs:
  _class_: experiment_base.MultiNoHistoryExperiment
  system_prompt: "Paraphrase this radiology findings sentence. Your paraphrase must be 1 sentence long. Return **only** the paraphrased text."
  n_turns: 5
  n_samples: 1
  output_path: output/uncertainty-in-llms-results/top-p-sampling/sentence-level/paraphrase-medical-finding/claude-haiku-4-5.jsonl
  
data_configs:
  input_path: data/preprocessed/MIMIC-CXR_combined_800.csv
  jinja_template: |
    {{ sentence }}


