connection_configs:
    api_key: ""
    base_url: http://localhost:8892/v1
    
model_configs:
  model_name: Qwen/Qwen3-8B
  model_device: vllm
  gen_kwargs:
    temperature: 1.0
    top_p: 0.9
    max_tokens: 3500

