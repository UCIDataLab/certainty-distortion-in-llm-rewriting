connection_configs:
    api_key: ""
    base_url: http://localhost:8893/v1
    
model_configs:
  model_name: meta-llama/Llama-3.3-70B-Instruct
  model_device: vllm
  gen_kwargs:
    temperature: 1.0
    top_p: 0.9
    max_tokens: 1000
