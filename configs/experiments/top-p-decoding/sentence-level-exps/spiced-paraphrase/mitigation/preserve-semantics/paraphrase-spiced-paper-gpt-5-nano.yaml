connection_configs:
    api_key: configs/api_keys/openai.txt

model_configs:
  model_name: gpt-5.4-nano
  model_device: openai
  gen_kwargs:
    temperature: 1.0
    top_p: 0.9
    max_completion_tokens: 1000

experiment_configs:
  _class_: experiment_base.MultiNoHistoryExperiment
  system_prompt: "Your task is to paraphrase an English text. When paraphrasing, avoid copying phrases from the provided text. Your paraphrase must be 1 sentence long and should preserve semantic meaning. Return **only** the paraphrased text."
  n_turns: 5
  n_samples: 1
  output_path: output/uncertainty-in-llms-results/mitigation/preserve-semantics/paraphrase-spiced-paper/gpt-5-nano.jsonl

data_configs:
  input_path: data/preprocessed/SPICED-news.csv
  jinja_template: |
    {{ Paper_Finding }}

