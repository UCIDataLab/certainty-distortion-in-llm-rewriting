connection_configs:
    api_key: 
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/

model_configs:
  model_name: gemini-3.1-flash-lite-preview
  model_device: openai
  gen_kwargs:
    temperature: 1.0
    top_p: 0.9
    max_tokens: 1000
    # the default reasoning effort for gemini-3.1-flash-lite is  "minimal"
    # source: https://ai.google.dev/gemini-api/docs/thinking#levels
    # reasoning_effort: minimal

experiment_configs:
  _class_: experiment_base.MultiNoHistoryExperiment
  system_prompt: "Your task is to paraphrase an English text. When paraphrasing, avoid copying phrases from the provided text. Your paraphrase must be 1 sentence long and should preserve semantic meaning. Do not hallucinate. Preserve the degree of certainty in the original text. Return **only** the paraphrased text."
  n_turns: 1
  n_samples: 1
  output_path: output/uncertainty-in-llms-results/mitigation/sentence-level/do-not-alter-certainty/paraphrase-spiced-paper/gemini-3.1-flash-lite.jsonl

data_configs:
  input_path: 
  jinja_template: |
    {{ Paper_Finding }}

